[project]
name = "slack-channel-manager"
version = "0.1.0"
description = "sort your slack channels in code"
authors = [{name = "Eli Block", email = "3347571+eliblock@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "requests>=2.31.0",
    "selenium>=4.16.0",
]

[project.scripts]
manager = "slack_channel_manager.cli:cli"

[project.optional-dependencies]
dev = [
    "black>=23.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black>=23.3.0",
]
